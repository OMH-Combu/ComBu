    <title>教員は多忙なのか2</title>

  <body>
    <div class="feature">
      <div class="feature-text>
        <h2>S先生</h2>
        <h2>担当:化学</h2>
        <p>(1)なぜ教員になろうと思ったのですか。</p>
        <p>A.一番は、教えるのが好きだったから。また、予備校に通う子が少なくなって、職を変える必要があると考えたから。あと、趣味と一致していたからかな。</p>
        <p>(2)この仕事のやりがい・魅力は何ですか？</p>
        <p>A.子供の成長が感じられることだねー。種をまいて芽が出て、花が咲いたり実がなったりすると嬉しいみたいな感じかな。</p>
        <p>(3)この仕事において、心がけていることはありますか。</P>
        <p>A.授業では、写真ではなく、実物を生徒に見せること。（ダイヤモンドとか）触れて、重さを感じてもらうことを意識しているよ。理科だからこそできることかもしれないね。</p>
        <p>(4)仕事をしていて思うことは？</p>
        <p>A.極論から言うと、教員は経済活動よりも趣味の延長線と考えたほうが多忙とは感じにくくなる気がする。経済活動の一環と考えると、忙しいと思う。
        <p>また、仕事に優先順位をつけること、ひとに頼まれたことは優先順位を最上位に、最初にやると仕事がたまらない。効率的にやる。やることリストを上から順に付けることが大切だと思うよ。</p>
        </div>
